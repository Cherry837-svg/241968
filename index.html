  <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Моё хранилище</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@29.2.0"></script>

<style>
:root {
    --bg: #7779B9;
    --card: #8587C5;
    --dark: #202844;
    --hover: #303F83;
    --lilac: #B4A1D5;
    --burgundy: #704567;
    --white: #ffffff;
    --muted: #E2E3F5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--white);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: var(--muted);
}

.card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

button, select, input {
    font: inherit;
}

button {
    background: var(--dark);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    margin: 4px;
}

button:hover {
    background: var(--hover);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 7px 0 15px;
    background: white;
    color: #222;
}

label {
    display: block;
    font-weight: bold;
}

.hidden {
    display: none !important;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 20px;
}

.tabs button {
    flex: 1;
    min-width: 105px;
}

.tabs button.active {
    background: var(--burgundy);
}

.file-card {
    background: rgba(255,255,255,.15);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.file-card h3 {
    margin-top: 0;
}

.file-card img,
.file-card video {
    max-width: 100%;
    max-height: 350px;
    border-radius: 8px;
    display: block;
    margin: 10px auto;
}

.file-card audio {
    width: 100%;
    margin: 10px 0;
}

.file-info {
    color: var(--muted);
    font-size: 13px;
}

.status {
    padding: 10px;
    margin-top: 10px;
    border-radius: 7px;
    background: rgba(0,0,0,.15);
    overflow-wrap: anywhere;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    padding: 30px;
    color: var(--muted);
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 25px;
}

@media(max-width:500px) {
    body {
        padding: 10px;
    }

    .card {
        padding: 14px;
    }

    header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📁 Моё хранилище</h1>
    <p>Личный архив документов, фотографий, видео и музыки</p>
</header>

<!-- АВТОРИЗАЦИЯ -->

<div class="card" id="authSection">

    <h2>🔐 Вход владельца</h2>

    <p>Просматривать архив можно без авторизации.
    Для управления файлами необходимо войти.</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="Ваш Email">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="Ваш пароль">

    <button onclick="login()">Войти</button>

    <div id="authStatus" class="status hidden"></div>

</div>

<!-- ПАНЕЛЬ ВЛАДЕЛЬЦА -->

<div class="card hidden" id="adminSection">

    <div class="toolbar">
        <h2>⚙ Управление архивом</h2>
        <button onclick="logout()">Выйти</button>
    </div>

    <label>Категория</label>

    <select id="uploadCategory">
        <option value="images">📷 Картинки</option>
        <option value="video">🎬 Видео</option>
        <option value="music">🎵 Музыка</option>
        <option value="pdf">📄 Документы</option>
        <option value="text">📝 Текстовые файлы</option>
        <option value="archive">📦 ZIP-архивы</option>
    </select>

    <label>Выберите файлы</label>

    <input type="file" id="fileInput" multiple>

    <button id="uploadButton" onclick="uploadFiles()">
        ⬆ Загрузить в облако
    </button>

    <div id="uploadStatus" class="status hidden"></div>

</div>

<!-- ОСНОВНОЙ АРХИВ -->

<div class="card">

    <div class="toolbar">
        <h2>☁ Мой архив</h2>
        <button onclick="loadFiles()">⟳ Обновить</button>
    </div>

    <div class="tabs">

        <button class="active" onclick="selectCategory('all',this)">
            Все
        </button>

        <button onclick="selectCategory('images',this)">
            📷 Фото
        </button>

        <button onclick="selectCategory('video',this)">
            🎬 Видео
        </button>

        <button onclick="selectCategory('music',this)">
            🎵 Музыка
        </button>

        <button onclick="selectCategory('pdf',this)">
            📄 PDF
        </button>

        <button onclick="selectCategory('text',this)">
            📝 Текст
        </button>

        <button onclick="selectCategory('archive',this)">
            📦 ZIP
        </button>

    </div>

    <div id="fileList">
        <div class="empty">Загрузка архива...</div>
    </div>

    <div id="mainStatus" class="status hidden"></div>

</div>

<footer>
    Моё хранилище · Appwrite Cloud
</footer>

</div>

<script>

// ==========================================
// 1. НАСТРОЙКИ APPWRITE
// ==========================================

const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';

const APPWRITE_PROJECT_ID = '6af2382700395f15d2f0';

const BUCKET_ID = '6af2441200126d7bde51';

// ВПИШИТЕ EMAIL ВЛАДЕЛЬЦА.
// Это дополнительная проверка интерфейса,
// но не замена серверным разрешениям Appwrite.

const ADMIN_EMAIL = 'stadnyk837@gmail.com';

const MAX_FILE_SIZE = 50 * 1024 * 1024;

// ==========================================
// 2. ПОДКЛЮЧЕНИЕ
// ==========================================

const client = new Appwrite.Client()
    .setEndpoint(APPWRITE_ENDPOINT)
    .setProject(APPWRITE_PROJECT_ID);

const account = new Appwrite.Account(client);
const storage = new Appwrite.Storage(client);

const { ID, Query } = Appwrite;

let currentUser = null;
let currentCategory = 'all';
let allFiles = [];

// ==========================================
// 3. КАТЕГОРИИ
// ==========================================

const categories = {
    images: 'Картинки',
    video: 'Видео',
    music: 'Музыка',
    pdf: 'Документы',
    text: 'Текстовые файлы',
    archive: 'ZIP-архивы'
};

// ==========================================
// 4. ОПРЕДЕЛЕНИЕ КАТЕГОРИИ
// ==========================================

function getCategory(file) {

    return file.folder || 'other';

}

function formatSize(bytes) {

    if (bytes < 1024) return bytes + ' Б';

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + ' КБ';

    return (bytes / (1024 * 1024)).toFixed(2) + ' МБ';

}

function formatDate(date) {

    return new Date(date).toLocaleString('ru-RU');

}

// ==========================================
// 5. СООБЩЕНИЯ
// ==========================================

function showMessage(id, text) {

    const element = document.getElementById(id);

    element.textContent = text;

    element.classList.remove('hidden');

}

function hideMessage(id) {

    document.getElementById(id).classList.add('hidden');

}

// ==========================================
// 6. ПРОВЕРКА СЕССИИ
// ==========================================

async function checkSession() {

    try {

        currentUser = await account.get();

        updateInterface();

    } catch (error) {

        currentUser = null;

        updateInterface();

    }

}

function isAdmin() {

    return currentUser &&
        ADMIN_EMAIL !== 'stadnyk837@gmail.com' &&
        currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

}

function updateInterface() {

    const admin = isAdmin();

    document.getElementById('authSection')
        .classList.toggle('hidden', admin);

    document.getElementById('adminSection')
        .classList.toggle('hidden', !admin);

}

// ==========================================
// 7. ВХОД
// ==========================================

async function login() {

    const email = document.getElementById('email').value.trim();

    const password = document.getElementById('password').value;

    if (!email || !password) {

        showMessage('authStatus', 'Заполните Email и пароль.');

        return;

    }

    try {

        await account.createEmailPasswordSession({
            email,
            password
        });

        currentUser = await account.get();

        if (!isAdmin()) {

            await account.deleteSession({
                sessionId: 'current'
            });

            currentUser = null;

            updateInterface();

            showMessage(
                'authStatus',
                'Этот аккаунт не является владельцем архива.'
            );

            return;

        }

        updateInterface();

        hideMessage('authStatus');

        await loadFiles();

    } catch (error) {

        showMessage('authStatus', 'Ошибка входа: ' + error.message);

    }

}

// ==========================================
// 8. ВЫХОД
// ==========================================

async function logout() {

    try {

        await account.deleteSession({
            sessionId: 'current'
        });

    } catch (error) {

        console.error(error);

    }

    currentUser = null;

    updateInterface();

    await loadFiles();

}

// ==========================================
// 9. ЗАГРУЗКА ФАЙЛОВ
// ==========================================

async function uploadFiles() {

    if (!isAdmin()) {

        alert('Нет доступа к загрузке.');

        return;

    }

    const input = document.getElementById('fileInput');

    const category = document.getElementById('uploadCategory').value;

    const files = Array.from(input.files);

    if (!files.length) {

        alert('Выберите файлы.');

        return;

    }

    const button = document.getElementById('uploadButton');

    button.disabled = true;

    let success = 0;

    let errors = 0;

    showMessage('uploadStatus', 'Начинаем загрузку...');

    for (let i = 0; i < files.length; i++) {

        const file = files[i];

        if (file.size > MAX_FILE_SIZE) {

            errors++;

            showMessage(
                'uploadStatus',
                `Пропущен ${file.name}: размер превышает 50 МБ.`
            );

            continue;

        }

        try {

            await storage.createFile({
                bucketId: BUCKET_ID,
                fileId: ID.unique(),
                file: file,
                folder: category
            });

            success++;

            showMessage(
                'uploadStatus',
                `Загружено ${success} из ${files.length}: ${file.name}`
            );

        } catch (error) {

            errors++;

            console.error(error);

            showMessage(
                'uploadStatus',
                `Ошибка загрузки ${file.name}: ${error.message}`
            );

        }

    }

    button.disabled = false;

    input.value = '';

    showMessage(
        'uploadStatus',
        `Загрузка завершена. Успешно: ${success}. Ошибок: ${errors}.`
    );

    await loadFiles();

}

// ==========================================
// 10. ПОЛУЧЕНИЕ СПИСКА ФАЙЛОВ
// ==========================================

async function loadFiles() {

    const list = document.getElementById('fileList');

    list.innerHTML = '<div class="empty">Загрузка...</div>';

    try {

        const response = await storage.listFiles({
            bucketId: BUCKET_ID,
            queries: [
                Query.limit(100),
                Query.orderDesc('$createdAt')
            ]
        });

        allFiles = response.files || [];

        renderFiles();

    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Не удалось получить список файлов.<br><br>
                ${escapeHTML(error.message)}
                <br><br>
                Проверьте разрешение Read в настройках Bucket.
            </div>
        `;

    }

}

// ==========================================
// 11. ВЫБОР КАТЕГОРИИ
// ==========================================

function selectCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll('.tabs button')
        .forEach(btn => btn.classList.remove('active'));

    button.classList.add('active');

    renderFiles();

}

// ==========================================
// 12. БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
// ==========================================

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    })[char]);

}

// ==========================================
// 13. ОТОБРАЖЕНИЕ ФАЙЛОВ
// ==========================================

function renderFiles() {

    const list = document.getElementById('fileList');

    list.innerHTML = '';

    const files = allFiles.filter(file => {

        return currentCategory === 'all' ||
            getCategory(file) === currentCategory;

    });

    if (!files.length) {

        list.innerHTML = `
            <div class="empty">
                Здесь пока нет файлов.
            </div>
        `;

        return;

    }

    files.forEach(file => {

        const card = document.createElement('div');

        card.className = 'file-card';

        const category = getCategory(file);

        const name = escapeHTML(file.name);

        const viewURL = storage.getFileView({
            bucketId: BUCKET_ID,
            fileId: file.$id
        });

        const downloadURL = storage.getFileDownload({
            bucketId: BUCKET_ID,
            fileId: file.$id
        });

        let preview = '';

        if (category === 'images') {

            preview = `
                <img src="${viewURL}"
                     alt="${name}"
                     loading="lazy">
            `;

        } else if (category === 'video') {

            preview = `
                <video controls preload="metadata">
                    <source src="${viewURL}">
                    Ваш браузер не поддерживает видео.
                </video>
            `;

        } else if (category === 'music') {

            preview = `
                <audio controls preload="none">
                    <source src="${viewURL}">
                </audio>
            `;

        } else if (category === 'pdf') {

            preview = `
                <a href="${viewURL}" target="_blank"
                   rel="noopener noreferrer">
                   📄 Открыть PDF
                </a>
            `;

        }

        card.innerHTML = `
            <h3>${name}</h3>

            ${preview}

            <div class="file-info">
                Категория: ${escapeHTML(categories[category] || 'Другое')}
                <br>
                Размер: ${formatSize(file.sizeOriginal)}
                <br>
                Дата: ${formatDate(file.$createdAt)}
            </div>

            <div>
                <a href="${downloadURL}" download="${name}">
                    <button>⬇ Скачать</button>
                </a>

                ${isAdmin() ? `
                    <button class="delete-button">
                        🗑 Удалить
                    </button>
                ` : ''}
            </div>
        `;

        if (isAdmin()) {

            card.querySelector('.delete-button')
                .addEventListener('click', () => deleteFile(file.$id, file.name));

        }

        list.appendChild(card);

    });

}

// ==========================================
// 14. УДАЛЕНИЕ ФАЙЛОВ
// ==========================================

async function deleteFile(fileId, fileName) {

    if (!isAdmin()) return;

    if (!confirm(`Удалить файл "${fileName}"?`)) return;

    try {

        await storage.deleteFile({
            bucketId: BUCKET_ID,
            fileId: fileId
        });

        showMessage('mainStatus', 'Файл успешно удалён.');

        await loadFiles();

    } catch (error) {

        alert('Ошибка удаления: ' + error.message);

    }

}

// ==========================================
// 15. ЗАПУСК
// ==========================================

document.addEventListener('DOMContentLoaded', async () => {

    await checkSession();

    await loadFiles();

});

</script>

</body>
</html>
